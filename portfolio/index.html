    <style>
      /* ===========================================================
         Additive styles for the fixed hero reveal + case-study modal.
         Namespaced with "pf-" so nothing collides with main.css.
         =========================================================== */

      /* ---- Hero: hover-reveal unicorn ---- */
      .pf-reveal {
        position: relative;
        overflow: hidden;
      }
      .pf-reveal__img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }
      .pf-reveal__img--sharp {
        opacity: 0;
        -webkit-mask-image: radial-gradient(
          circle var(--pf-radius, 150px) at var(--pf-x, 50%) var(--pf-y, 50%),
          black 0%,
          black 55%,
          transparent 100%
        );
        mask-image: radial-gradient(
          circle var(--pf-radius, 150px) at var(--pf-x, 50%) var(--pf-y, 50%),
          black 0%,
          black 55%,
          transparent 100%
        );
        transition: opacity 0.35s ease;
      }
      .pf-reveal--active .pf-reveal__img--sharp {
        opacity: 1;
      }
      .pf-reveal__hint {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-family: var(--font-family-body);
        font-size: 12px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--medium-gray);
        background: rgba(255, 255, 255, 0.85);
        padding: 4px 10px;
        border-radius: 12px;
        opacity: 1;
        transition: opacity 0.4s ease;
        pointer-events: none;
        white-space: nowrap;
      }
      .pf-reveal--active .pf-reveal__hint {
        opacity: 0;
      }
      #bridge {
        cursor: crosshair;
      }

      /* ---- Category tabs (dynamically built from categories.js) ---- */
      #list li a {
        cursor: pointer;
      }

      /* ---- Project card polish (image already styled by main.css) ---- */
      .card {
        cursor: pointer;
        position: relative;
      }
      .pf-card-meta {
        position: absolute;
        left: 8px;
        bottom: 8px;
        z-index: 1;
        font-family: var(--font-family-body);
        font-size: 11px;
        color: var(--white);
        background: rgba(0, 0, 0, 0.55);
        padding: 2px 8px;
        border-radius: 10px;
        pointer-events: none;
      }

      /* ---- Case-study detail modal ---- */
      .pf-modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: flex-start;
        justify-content: center;
        overflow-y: auto;
        padding: 40px 16px;
        background: rgba(20, 20, 30, 0.6);
      }
      .pf-modal.pf-modal--open {
        display: flex;
      }
      .pf-modal__panel {
        position: relative;
        width: 100%;
        max-width: 820px;
        background: var(--white);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        animation: pf-pop 0.25s ease;
      }
      @keyframes pf-pop {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .pf-modal__close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 30px;
        height: 30px;
        padding: 0;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.9);
        color: var(--primary);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        z-index: 2;
      }
      .pf-modal__image {
        width: 100%;
        max-height: 420px;
        object-fit: cover;
        display: block;
        background: var(--off-white);
      }
      .pf-modal__body {
        padding: 28px 32px 32px;
        font-family: var(--font-family-body);
        color: var(--dark-gray);
      }
      .pf-modal__eyebrow {
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--light-primary);
        font-weight: 700;
        margin: 0 0 6px;
      }
      .pf-modal__title {
        font-family: var(--font-family-heading);
        color: var(--primary);
        margin: 0 0 4px;
      }
      .pf-modal__client {
        margin: 0 0 18px;
        font-weight: 700;
      }
      .pf-modal__client a {
        color: var(--dark-gray);
      }
      .pf-modal__desc {
        line-height: 1.6;
      }
      .pf-modal__actions {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .pf-siblings {
        margin-top: 28px;
        border-top: 1px solid var(--light-gray);
        padding-top: 18px;
      }
      .pf-siblings__heading {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--medium-gray);
        margin: 0 0 12px;
      }
      .pf-siblings__list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .pf-sibling {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--light-gray);
        border-radius: 20px;
        padding: 4px 12px 4px 4px;
        cursor: pointer;
        background: none;
        font-family: var(--font-family-body);
        font-size: 13px;
        color: var(--dark-gray);
      }
      .pf-sibling:hover {
        border-color: var(--light-primary);
        color: var(--light-primary);
      }
      .pf-sibling img {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        object-fit: cover;
      }
      @media (max-width: 600px) {
        .pf-modal__body {
          padding: 22px 18px 26px;
        }
      }
    </style>

    <script>
      /* =====================================================
         1) Hero reveal — fixed, hover/touch driven
         ===================================================== */
      (function heroReveal() {
        const figure = document.getElementById("unicornReveal");

        function setSpot(clientX, clientY) {
          const r = figure.getBoundingClientRect();
          const x = ((clientX - r.left) / r.width) * 100;
          const y = ((clientY - r.top) / r.height) * 100;
          figure.style.setProperty("--pf-x", x + "%");
          figure.style.setProperty("--pf-y", y + "%");
        }

        function activate(e) {
          figure.classList.add("pf-reveal--active");
          const point = e.touches ? e.touches[0] : e;
          setSpot(point.clientX, point.clientY);
        }

        function deactivate() {
          figure.classList.remove("pf-reveal--active");
        }

        // Mouse
        figure.addEventListener("mouseenter", activate);
        figure.addEventListener("mousemove", activate);
        figure.addEventListener("mouseleave", deactivate);

        // Touch (mobile): drag a finger across to reveal
        figure.addEventListener("touchstart", activate, { passive: true });
        figure.addEventListener("touchmove", activate, { passive: true });
        figure.addEventListener("touchend", deactivate);
      })();

      /* =====================================================
         2) Projects — clustered into categories via categories.js,
            with a real creative-process detail panel per project.
         ===================================================== */
      (function projectsUI() {
        // Only case-study sub-pages that currently have real, published
        // write-ups get an outbound "read the full case study" link —
        // the rest of assets/cases/*.html are still empty placeholders
        // in this repo, so we surface the creative-process description
        // (from categories.js) directly in the panel instead of linking
        // to a blank page.
        const LIVE_CASE_PAGES = new Set(["AllThingsClean"]);

        // categories.js builds image/link paths relative to pages/2024/
        // (e.g. "./assets/img/Logo_Mockup_LAEC.jpg"). This page now lives
        // at /portfolio/, so rewrite that "./" prefix to point back at the
        // shared assets folder. External URLs (https://...) pass through
        // untouched.
        function resolveAssetPath(path) {
          return path.replace(/^\.\//, "../pages/2024/");
        }

        const CASE_STUDY_CONTENT = {
          AllThingsClean:
            "All Things Clean is a personable vacuum and appliance store near downtown Los Gatos, California. Most appliances and vacuums from big American brands are made overseas and rarely last past the first few years — the brand redesign leans into the opposite promise: a knowledgeable person who helps you choose equipment that lasts 10–20 years, and who actually picks up the phone instead of routing you to a call center.",
        };

        const container = document.getElementById("projects-container");
        const listEl = document.getElementById("list");
        const dropdownEl = document.getElementById("dropdown");

        function titleCase(category) {
          if (category === "ui ux") return "UI UX";
          return category.replace(/\b\w/g, (c) => c.toUpperCase());
        }

        function allProjects() {
          const projects = {};
          Object.keys(Collection.categories).forEach((category) => {
            Object.assign(projects, Collection.categories[category]);
          });
          return projects;
        }

        function selectProjects(category) {
          return category === "all"
            ? allProjects()
            : Collection.categories[category];
        }

        function buildTabs() {
          const categories = ["all", ...Object.keys(Collection.categories)];
          categories.forEach((category, i) => {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.textContent = category === "all" ? "All" : titleCase(category);
            a.dataset.category = category;
            if (i === 0) a.classList.add("active");
            li.appendChild(a);
            listEl.appendChild(li);

            const option = document.createElement("option");
            option.value = category;
            option.textContent = a.textContent;
            dropdownEl.appendChild(option);
          });
        }

        function render(category) {
          container.innerHTML = "";
          const selected = selectProjects(category) || {};
          Object.values(selected).forEach((project) => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <div style="background-image:url('${resolveAssetPath(project.image)}')" class="project-img">
                <span class="pf-card-meta">${titleCase(project.type
                  .replace(/([A-Z])/g, " $1")
                  .trim()
                  .toLowerCase())}</span>
                <div class="hover-overlay flex center light">
                  <strong>${project.title}</strong>
                </div>
              </div>`;
            card.addEventListener("click", () => openModal(project));
            container.appendChild(card);
          });
        }

        function wireTabs() {
          listEl.querySelectorAll("a").forEach((a) => {
            a.addEventListener("click", () => {
              listEl
                .querySelectorAll("a")
                .forEach((el) => el.classList.remove("active"));
              a.classList.add("active");
              dropdownEl.value = a.dataset.category;
              render(a.dataset.category);
            });
          });
          dropdownEl.addEventListener("change", (e) => {
            const category = e.target.value;
            listEl.querySelectorAll("a").forEach((el) => {
              el.classList.toggle("active", el.dataset.category === category);
            });
            render(category);
          });
        }

        /* ---- Modal / case-study detail ---- */
        const modal = document.getElementById("pfModal");
        const modalImage = document.getElementById("pfModalImage");
        const modalEyebrow = document.getElementById("pfModalEyebrow");
        const modalTitle = document.getElementById("pfModalTitle");
        const modalClient = document.getElementById("pfModalClient");
        const modalDesc = document.getElementById("pfModalDesc");
        const modalActions = document.getElementById("pfModalActions");
        const siblingsWrap = document.getElementById("pfSiblings");
        const siblingsList = document.getElementById("pfSiblingsList");

        function getSiblings(project) {
          const siblings = [];
          Object.entries(Collection.categories).forEach(
            ([category, collection]) => {
              Object.values(collection).forEach((p) => {
                if (p.id === project.id && p !== project) {
                  siblings.push(p);
                }
              });
            }
          );
          return siblings;
        }

        function openModal(project) {
          modalImage.src = resolveAssetPath(project.image);
          modalImage.alt = project.title;
          modalEyebrow.textContent = `${titleCase(
            project.type.replace(/([A-Z])/g, " $1").trim().toLowerCase()
          )} · ${project.date}`;
          modalTitle.textContent = project.title;
          modalClient.innerHTML = `For <a href="${project.clientURL}" target="_blank" rel="noopener">${project.client}</a>`;
          modalDesc.textContent =
            CASE_STUDY_CONTENT[project.id] || project.description;

          modalActions.innerHTML = "";
          if (LIVE_CASE_PAGES.has(project.id)) {
            modalActions.innerHTML += `<a class="button" href="${resolveAssetPath(project.link)}" target="_blank" rel="noopener">Read the full case study</a>`;
          }
          if (project.link &&
              project.linkName !== "Case Study" &&
              project.linkName !== "Brand Review" &&
              project.linkName !== "Details") {
            modalActions.innerHTML += `<a class="button" href="${project.link}" target="_blank" rel="noopener">${project.linkName}</a>`;
          }

          const siblings = getSiblings(project);
          if (siblings.length) {
            siblingsWrap.style.display = "block";
            siblingsList.innerHTML = "";
            siblings.forEach((sibling) => {
              const btn = document.createElement("button");
              btn.className = "pf-sibling";
              btn.innerHTML = `<img src="${resolveAssetPath(sibling.image)}" alt="" />${titleCase(
                sibling.type.replace(/([A-Z])/g, " $1").trim().toLowerCase()
              )}`;
              btn.addEventListener("click", () => openModal(sibling));
              siblingsList.appendChild(btn);
            });
          } else {
            siblingsWrap.style.display = "none";
          }

          modal.classList.add("pf-modal--open");
        }

        function closeModal() {
          modal.classList.remove("pf-modal--open");
        }

        document
          .getElementById("pfModalClose")
          .addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => {
          if (e.target === modal) closeModal();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeModal();
        });

        buildTabs();
        wireTabs();
        render("all");
      })();
    </script>
